name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-static-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.AZURE_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment: azure-production
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.17.2"
      - name: Validate Azure infrastructure
        run: |
          terraform -chdir=terraform/azure init -backend=false -input=false -lockfile=readonly
          terraform -chdir=terraform/azure fmt -check
          terraform -chdir=terraform/azure validate
          terraform -chdir=terraform/azure test
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Test frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - name: Validate deployment settings
        shell: bash
        env:
          DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          APPLICATION_URL: ${{ vars.AZURE_APPLICATION_URL }}
        run: |
          set -euo pipefail
          : "${DEPLOYMENT_TOKEN:?Set AZURE_STATIC_WEB_APPS_API_TOKEN}"
          : "${APPLICATION_URL:?Set AZURE_APPLICATION_URL}"
      - name: Publish frontend
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: public
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true
          production_branch: main
      - name: Verify frontend
        shell: bash
        env:
          APPLICATION_URL: ${{ vars.AZURE_APPLICATION_URL }}
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-all-errors --retry-delay 3 \
            --connect-timeout 10 --max-time 30 "$APPLICATION_URL/" --output /dev/null
          curl --fail --connect-timeout 10 --max-time 30 \
            "$APPLICATION_URL/projects.json" --output "$RUNNER_TEMP/projects.json"
          node -e 'const p=JSON.parse(require("fs").readFileSync(process.argv[1])); if(!Array.isArray(p) || !p.length) process.exit(1)' "$RUNNER_TEMP/projects.json"
          echo "Frontend: $APPLICATION_URL" >> "$GITHUB_STEP_SUMMARY"
