name: Deploy to AWS Static Hosting

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-static-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.17.2"
      - name: Validate AWS infrastructure
        run: |
          terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly
          terraform -chdir=terraform fmt -check
          terraform -chdir=terraform validate
          terraform -chdir=terraform test
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Test frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - name: Validate deployment settings
        shell: bash
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          WEBSITE_BUCKET: ${{ vars.WEBSITE_BUCKET }}
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          APPLICATION_URL: ${{ vars.AWS_APPLICATION_URL }}
        run: |
          set -euo pipefail
          : "${ROLE_ARN:?Set AWS_ROLE_ARN}"
          : "${AWS_REGION:?Set AWS_REGION}"
          : "${WEBSITE_BUCKET:?Set WEBSITE_BUCKET}"
          : "${DISTRIBUTION_ID:?Set CLOUDFRONT_DISTRIBUTION_ID}"
          : "${APPLICATION_URL:?Set AWS_APPLICATION_URL}"
      - name: Sign in to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Publish frontend and refresh cache
        shell: bash
        env:
          WEBSITE_BUCKET: ${{ vars.WEBSITE_BUCKET }}
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          aws s3 sync public/ "s3://$WEBSITE_BUCKET/" --delete \
            --cache-control "public,max-age=300,must-revalidate" --only-show-errors
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" --paths "/*" \
            --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" --id "$invalidation_id"
      - name: Verify frontend
        shell: bash
        env:
          APPLICATION_URL: ${{ vars.AWS_APPLICATION_URL }}
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-all-errors --retry-delay 3 \
            --connect-timeout 10 --max-time 30 "$APPLICATION_URL/" --output /dev/null
          curl --fail --connect-timeout 10 --max-time 30 \
            "$APPLICATION_URL/projects.json" --output "$RUNNER_TEMP/projects.json"
          node -e 'const p=JSON.parse(require("fs").readFileSync(process.argv[1])); if(!Array.isArray(p) || !p.length) process.exit(1)' "$RUNNER_TEMP/projects.json"
          echo "Frontend: $APPLICATION_URL" >> "$GITHUB_STEP_SUMMARY"
